<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <style>
    :root{
      --black:#111827;
      --orange:#156082;
      --bg:#f7f9fc;

    }

    .card-subcategories{

     margin:2px 0 12px;
    }

    .card-subcategory{

      background:#f3f4f6;
      color:#4b5563;

      font-weight:700;
      line-height:1.2;
    }

    .directory-header{
      position:sticky;top:0;z-index:40;
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:13px 20px;margin:0 0 28px;
      background:rgba(255,255,255,.97);border:1px solid var(--line);
      border-radius:16px;box-shadow:0 5px 22px rgba(17,24,39,.07);

    .header-brand{display:flex;flex-direction:column;gap:3px}
    .header-brand strong{font-size:17px;letter-spacing:-.02em}
    .header-brand small{font-size:11px;color:var(--muted);font-weight:700}
    .cart-fab{
      border:0;border-radius:12px;padding:13px 18px;
      background:var(--orange);color:#fff;font-size:14px;font-weight:800;
      box-shadow:0 5px 16px rgba(17,24,39,.18);cursor:pointer;
    }
    .cart-fab[hidden]{display:none!important}

    .overlay{
      position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:50;
      display:none;align-items:center;justify-content:center;padding:20px;
    }
    .overlay.open{display:flex}
    .modal{
      width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;
      border-radius:26px;box-shadow:0 30px 100px rgba(0,0,0,.25);
    }
    .modal-head{
      position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);

    }
    .modal-head h2{font-size:21px;margin:0}
    .close{border:0;background:#f1f3f5;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:20px}
    .modal-body{padding:24px}
    .field-label{display:block;font-weight:800;margin:0 0 10px}
    .help{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.6}
    textarea,.text-input{
      width:100%;border:1px solid #d7dce3;border-radius:12px;padding:13px 14px;outline:none;
    }
    textarea{min-height:110px;resize:vertical}
    textarea:focus,.text-input:focus{border-color:#111827}
    .btn{height:44px;padding:0 18px;border-radius:12px;border:0;font-weight:800;cursor:pointer}
    .btn.primary{background:#111827;color:#fff}

    .cart-item{

    }

    .cart-meta{font-size:13px;color:var(--muted);line-height:1.6}

    .mini-btn{border:0;background:#f1f3f5;border-radius:10px;padding:8px 10px;font-weight:700;cursor:pointer}
    .mini-btn.remove{color:#b42318;background:#fff0ee}

    }

      font-weight:700;
      cursor:pointer;

    }

    .filter-chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      border:0;
      background:#f3f4f6;
      color:#374151;
      border-radius:999px;
      padding:7px 11px;

      font-weight:700;

    }

      color:var(--muted);
      font-size:13px;

      color:#183153;
      border:1px solid #cddfff;

      padding:5px 9px;

      font-weight:800;
      white-space:nowrap;
    }

      z-index:19;

      height:48px;

      border-radius:50%;

/* ============================================================
   2) 샘플 디렉토리 데이터
   ============================================================ */

let companies = [];

function loadCompanies() {
  fetch("./companies.json", { cache: "no-cache" })
    .then(res => {
      if (!res.ok) {
        throw new Error(`HTTP error: ${res.status}`);
      }
      return res.json();
    })
    .then(data => {
      if (!Array.isArray(data)) {
        throw new Error("companies.json must contain a JSON array.");
      }

      companies = data;
      initializeFilters();
      renderCompanies();
      updateCartCount();

      const match = location.hash.match(/^#company=(.+)$/);
      if (match) {
        const id = decodeURIComponent(match[1]);
        const company = companies.find(c => String(c.id) === id);
        if (company) openCompanyDetail(company.id);
      }
    })
    .catch(error => {
      console.error("DATA LOAD ERROR:", error);
      document.getElementById("companyGrid").innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:40px;color:#6b7280">
          Failed to load companies.json.
        </div>
      `;
    });
}

function splitMultiValue(value) {
  return String(value || "")
    .split(/\r?\n|,\s*/)
    .map(v => v.trim())
    .filter(Boolean);
}

function convertDriveImageUrl(url) {
  const value = String(url || "").trim();

  const match =
    value.match(/[?&]id=([^&]+)/) ||
    value.match(/\/d\/([^/]+)/);

  if (!match) return value;

  const fileId = match[1];

  return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1200`;
}

function saveCartToLocalStorage() {
  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );
}

function loadCartFromLocalStorage() {
  try {
    return JSON.parse(
      localStorage.getItem(CART_KEY) || "[]"
    );
  } catch (error) {
    return [];
  }
}

function saveSubmittedRequests() {
  localStorage.setItem(
    SUBMITTED_KEY,
    JSON.stringify(submittedRequests)
  );
}

function loadSubmittedRequests() {
  try {
    return JSON.parse(
      localStorage.getItem(SUBMITTED_KEY) || "[]"
    );
  } catch (error) {
    return [];
  }
}

function initializeFilters() {
  const categoryFilter = document.getElementById("categoryFilter");

  const availableCategories = new Set(
    companies.flatMap(company =>
      company.categories?.main || []
    )
  );

  const categories = CATEGORY_ORDER.filter(category =>
    availableCategories.has(category)
  );

  categoryFilter.innerHTML =
    `<option value="">All Categories</option>` +
    categories
      .map(category =>
        `<option value="${escapeAttr(category)}">
          ${escapeHtml(category)}
        </option>`
      )
      .join("");

  updateSubcategoryOptions();

  document
    .getElementById("searchInput")
    .addEventListener("input", () => {
      currentPage = 1;
      renderCompanies();
    });

  categoryFilter.addEventListener("change", () => {

    subcategoryFilter.value = "";

    updateSubcategoryOptions();
    renderCompanies();
  });

  subcategoryFilter.addEventListener(
    "change",
    renderCompanies
  );
}

function updateSubcategoryOptions() {
  const category =
    document.getElementById("categoryFilter").value;

  const subcategoryFilter =
    document.getElementById("subcategoryFilter");

  let subcategories = [];

  if (category) {

    subcategories =
      SUBCATEGORY_MAP[category] || [];

  } else {

    subcategories =
      Object.values(SUBCATEGORY_MAP).flat();
  }

  const availableSubcategories = new Set(
    companies.flatMap(company =>
      company.categories?.sub || []
    )
  );

  subcategories = subcategories.filter(sub =>
    availableSubcategories.has(sub)
  );

  subcategoryFilter.innerHTML =
    `<option value="">
      ${category
        ? `All ${escapeHtml(category)}`
        : "All Subcategories"
      }
    </option>` +
    subcategories
      .map(sub =>
        `<option value="${escapeAttr(sub)}">
          ${escapeHtml(sub)}
        </option>`
      )
      .join("");
}

function getCompanySearchText(company) {
  const productText = (company.products || [])
    .map(product => [
      product.name || "",
      product.certification || ""
    ].join(" "))
    .join(" ");

  return [
    company.companyName || "",
    ...(company.categories?.main || []),
    ...(company.categories?.sub || []),
    productText
  ]
    .join(" ")
    .toLowerCase();
}

function getCategoryClass(category) {
  const map = {
    "Beauty": "beauty",
    "Food": "food",
    "Home&Living": "home-living",
    "Healthcare": "healthcare",
    "Digital&Industrial": "digital-industrial"
  };

  return map[category] || "";
}

function getFilteredCompanies() {

  const keyword =
    document
      .getElementById("searchInput")
      ?.value
      .trim()
      .toLowerCase() || "";

  const category =
    document
      .getElementById("categoryFilter")
      ?.value || "";

  const subcategory =
    document
      .getElementById("subcategoryFilter")
      ?.value || "";


  return companies.filter(company => {

    const keywordMatch =
      !keyword ||
      getCompanySearchText(company)
        .includes(keyword);

    const categoryMatch =
      !category ||
      (company.categories?.main || [])
        .includes(category);

    const subcategoryMatch =
      !subcategory ||
      (company.categories?.sub || [])
        .includes(subcategory);

    return (
      keywordMatch &&
      categoryMatch &&
      subcategoryMatch
    );
  });
}

function renderPagination(totalPages) {

  const container =
    document.getElementById("pagination");

  if (totalPages <= 1) {
    container.innerHTML = "";
    return;
  }

  const PAGES_PER_GROUP = 12;

  const currentGroup =
    Math.floor((currentPage - 1) / PAGES_PER_GROUP);

  const startPage =
    currentGroup * PAGES_PER_GROUP + 1;

  const endPage =
    Math.min(
      startPage + PAGES_PER_GROUP - 1,
      totalPages
    );

  let html = "";

  html += `
    <button
      class="page-btn"
      type="button"
      onclick="goToPage(${startPage - 1})"
      ${startPage === 1 ? "disabled" : ""}
    >
      ‹
    </button>
  `;

  for (
    let page = startPage;
    page <= endPage;
    page++
  ) {

    html += `
      <button
        class="page-btn ${page === currentPage ? "active" : ""}"
        type="button"
        onclick="goToPage(${page})"
      >
        ${page}
      </button>
    `;
  }


  html += `
    <button
      class="page-btn"
      type="button"
      onclick="goToPage(${endPage + 1})"
      ${endPage === totalPages ? "disabled" : ""}
    >
      ›
    </button>
  `;


  container.innerHTML = html;
}

function goToPage(page) {

  const totalPages =
    Math.ceil(
      getFilteredCompanies().length /
      ITEMS_PER_PAGE
    );

  if (
    page < 1 ||
    page > totalPages
  ) {
    return;
  }

  currentPage = page;

  renderCompanies();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function saveToCart() {
  const company = companies.find(c => String(c.id) === String(editingCompanyId));
  if (!company) return;

  if (
  submittedRequests.some(
    item => String(item.companyId) === String(company.id)
  )
) {
  alert("This company has already been submitted.");
  return;
}

  const reason = document
  .getElementById("reasonInput")
  .value.trim();

  const alreadyExists = cart.some(item => String(item.companyId) === String(company.id));

  const totalRequestCount =
    submittedRequests.length + cart.length;

  if (
    !alreadyExists &&
    totalRequestCount >= 30
  ) {
    alert(
      "Submitted requests and current meeting requests combined cannot exceed 30 companies."
    );
    return;
  }

  const newItem = {
  companyId: company.id,
  companyName: company.companyName,
  reason
};

  const index = cart.findIndex(item => String(item.companyId) === String(company.id));

  if (index >= 0) {
    cart[index] = newItem;
  } else {
    cart.push(newItem);
  }

  saveMeetingDraft();

  updateCartCount();
  renderCompanies();
  // Refresh the inline form and saved-request status.

  if (!document.getElementById("detailView").hidden) {
    openCompanyDetail(company.id, false);
    requestAnimationFrame(() => {
      document.getElementById("meetingRequestSection")?.scrollIntoView({behavior:"smooth",block:"start"});
    });
  }
}

async function submitAllRequests() {
  const buyerCompany = document
  .getElementById("buyerCompanyInput")
  .value.trim();

if (!buyerCompany) {
  alert("Please enter your company name.");
  document.getElementById("buyerCompanyInput").focus();
  return;
}

currentBuyerCompany = buyerCompany;
localStorage.setItem(BUYER_KEY, buyerCompany);

  if (!cart.length) {
    alert("신청할 기업이 없습니다.");
    return;
  }

  const isFirstSubmission =
    submittedRequests.length === 0;

  if (
    isFirstSubmission &&
    cart.length < 10
  ) {
    alert(
      "For your first submission, please select at least 10 companies."
    );
    return;
  }

  const totalRequestCount =
    submittedRequests.length + cart.length;

  if (totalRequestCount > 30) {
    alert(
      "Submitted requests and new meeting requests combined cannot exceed 30 companies."
    );
    return;
  }

  if (totalRequestCount > GOOGLE_FORM.requests.length) {
    alert("The form does not have enough request fields.");
    return;
  }

  const btn = document.getElementById("finalSubmitBtn");
  btn.disabled = true;
  btn.textContent = "Submitting...";

  /*
    fetch() 대신 hidden form + iframe 방식을 사용.
    Google Forms는 cross-origin 응답을 JS에서 읽기 어렵기 때문에,
    사용자가 Google Form 화면으로 이동하지 않도록 백그라운드 iframe으로 제출함.
  */

  const allRequests = [
    ...submittedRequests
  ];

  cart.forEach(item => {
   const existingIndex =
      allRequests.findIndex(
        existing =>
          String(existing.companyId) === String(item.companyId)
      );

    if (existingIndex >= 0) {
      allRequests[existingIndex] = item;
    } else {
      allRequests.push(item);
    }
  });

  submitGoogleFormResponse({
    buyerCompany,
    items: allRequests
  });

  /*
    주의:
    cross-origin 특성상 브라우저에서 Google Form의 '실제 저장 성공' 응답을
    직접 판독하기는 어렵습니다.

function markCurrentCartAsSubmitted(items) {
  submittedRequests = [
    ...submittedRequests,
    ...items.filter(item =>
      !submittedRequests.some(
        submitted =>
          String(submitted.companyId) === String(item.companyId)
      )
    )
  ];

  saveSubmittedRequests();
}

function submitGoogleFormResponse({ buyerCompany, items }) {
  const frameName = `googleFormFrame_${Date.now()}`;

  const iframe = document.createElement("iframe");
  iframe.name = frameName;
  iframe.style.display = "none";
  document.getElementById("hiddenFrames").appendChild(iframe);

  const form = document.createElement("form");
  form.method = "POST";
  form.action = GOOGLE_FORM.formResponseUrl;
  form.target = frameName;
  form.style.display = "none";

  addHiddenField(form, "fvv", "1");
  addHiddenField(form, "draftResponse", "[]");
  addHiddenField(form, "pageHistory", "0");

  addHiddenField(form, GOOGLE_FORM.buyerCompany, buyerCompany);

  items.slice(0, GOOGLE_FORM.requests.length).forEach((item, index) => {
  const fields = GOOGLE_FORM.requests[index];
  if (!fields) return;

  addHiddenField(form, fields.company, item.companyName);
  addHiddenField(form, fields.reason, item.reason);
});

  document.body.appendChild(form);

  console.log("Submitting Google Form:", {
    buyerCompany,
    requestCount: items.length,
    formAction: form.action
  });

  form.submit();

  setTimeout(() => {
    form.remove();
    iframe.remove();
  }, 5000);
}

function addHiddenField(form, name, value) {
  const input = document.createElement("input");
  input.type = "hidden";
  input.name = name;
  input.value = value;
  form.appendChild(input);
}

function saveMeetingDraft() {
  saveCartToLocalStorage();
}

/* ============================================================
   8) HTML escape
   ============================================================ */

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
  return escapeHtml(value);
}

function scrollDetailToTop() {

  });
